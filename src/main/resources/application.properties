server.port=${PORT:8080}

# ---- MySQL ----
# The database "queuedb" is created automatically if it does not exist (createDatabaseIfNotExist=true).
# CHANGE the username and password below to YOUR MySQL username and password.
spring.datasource.url=jdbc:mysql://localhost:3306/queuedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&nullCatalogMeansCurrent=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
# Create tables on startup (schema.sql is safe to run many times)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT signing secret: must be at least 32 characters. Override with env var JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
